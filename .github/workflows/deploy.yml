name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject Formspree form IDs from secrets
        env:
          FORMSPREE_FORM_ID: ${{ secrets.FORMSPREE_FORM_ID }}
          FORMSPREE_APPLY_FORM_ID: ${{ secrets.FORMSPREE_APPLY_FORM_ID }}
        run: |
          if [ -z "$FORMSPREE_FORM_ID" ]; then
            echo "::error::FORMSPREE_FORM_ID repository secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          if [ -z "$FORMSPREE_APPLY_FORM_ID" ]; then
            echo "::error::FORMSPREE_APPLY_FORM_ID repository secret is not set. Add it under Settings → Secrets and variables → Actions."
            exit 1
          fi
          # Targeted substitution: each placeholder in its own file, formspree URL only.
          sed -i "s|formspree.io/f/__FORMSPREE_FORM_ID__|formspree.io/f/${FORMSPREE_FORM_ID}|g" index.html
          sed -i "s|formspree.io/f/__FORMSPREE_APPLY_FORM_ID__|formspree.io/f/${FORMSPREE_APPLY_FORM_ID}|g" apply/index.html
          if grep -qE "formspree.io/f/__FORMSPREE_(APPLY_)?FORM_ID__" index.html apply/index.html; then
            echo "::error::Placeholder still present in form action after substitution"
            exit 1
          fi
          echo "Substitution successful"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
